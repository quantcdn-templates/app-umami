# Quant Cloud: run on ARM64 to match the arm64 images the org builds.
x-quant-labels:
  quant.architecture: ARM64

services:
  umami:
    build: .
    restart: always
    environment:
      # Quant Cloud injects managed DB_* settings. Local credentials belong in
      # docker-compose.override.yml; do not override the cloud database here.
      DATABASE_TYPE: postgresql
      # Optional: Rename tracking script to avoid ad blockers
      # TRACKER_SCRIPT_NAME: stats
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/heartbeat || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    image: postgres:15-alpine
    restart: always
    labels:
      quant.type: postgres
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${DB_PASSWORD:-umami}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  umami-db-data:
