# CI workflow for Umami Analytics template
# Validates that the template builds successfully
#
# Scheduled daily to catch upstream image changes early.
name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          pull: true
          push: false
          load: true
          tags: app-umami:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify patched Node runtime
        run: docker run --rm --entrypoint node app-umami:test /usr/local/bin/verify-node-runtime.cjs

      - name: Test application with PostgreSQL
        run: |
          trap 'docker rm -f umami-test umami-db >/dev/null 2>&1; docker network rm umami-test >/dev/null 2>&1' EXIT
          docker network create umami-test
          docker run -d --name umami-db --network umami-test \
            -e POSTGRES_USER=umami -e POSTGRES_PASSWORD=ci-test-password \
            -e POSTGRES_DB=umami postgres:15-alpine
          for attempt in $(seq 1 30); do
            if docker exec umami-db pg_isready -U umami -d umami; then break; fi
            sleep 2
          done
          docker exec umami-db pg_isready -U umami -d umami
          docker run -d --name umami-test --network umami-test -p 3000:3000 \
            -e DATABASE_URL="postgresql://umami:ci-test-password@umami-db:5432/umami" \
            -e DATABASE_TYPE=postgresql -e APP_SECRET=ci-only-test-secret \
            app-umami:test
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/heartbeat; then exit 0; fi
            sleep 2
          done
          docker logs umami-test
          exit 1
