# CI workflow for Umami Analytics template
# Validates that the template builds successfully
#
# Scheduled daily to catch upstream image changes early.
name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          pull: true
          push: false
          load: true
          tags: app-umami:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify patched Node runtime
        run: docker run --rm --entrypoint node app-umami:test /usr/local/bin/verify-node-runtime.cjs

      - name: Test application with PostgreSQL
        run: |
          trap 'docker rm -f umami-test umami-db >/dev/null 2>&1; docker network rm umami-test >/dev/null 2>&1' EXIT
          docker network create umami-test
          mkdir -p "$RUNNER_TEMP/umami-tls"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=umami-db \
            -keyout "$RUNNER_TEMP/umami-tls/server.key" -out "$RUNNER_TEMP/umami-tls/server.crt"
          docker run -d --name umami-db --network umami-test \
            -v "$RUNNER_TEMP/umami-tls:/certs" --entrypoint sh \
            -e POSTGRES_USER=umami -e POSTGRES_PASSWORD=ci-test:password@ \
            -e POSTGRES_DB=umami postgres:15-alpine -c \
            'chown postgres:postgres /certs/server.key; chmod 600 /certs/server.key; exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key'
          for attempt in $(seq 1 30); do
            if docker exec umami-db pg_isready -U umami -d umami; then break; fi
            sleep 2
          done
          docker exec umami-db pg_isready -U umami -d umami
          docker run -d --name umami-test --network umami-test -p 3000:3000 \
            -v "$RUNNER_TEMP/umami-tls/server.crt:/certs/server.crt:ro" \
            -e DB_SSLROOTCERT=/certs/server.crt \
            -e DB_HOST=umami-db -e DB_PORT=5432 -e DB_DATABASE=umami \
            -e DB_USERNAME=umami -e DB_PASSWORD=ci-test:password@ \
            -e DATABASE_TYPE=postgresql \
            app-umami:test
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/heartbeat; then
              TLS_CONNECTIONS=$(docker exec umami-db psql -U umami -d umami -Atc 'SELECT count(*) FROM pg_stat_ssl WHERE ssl')
              test "$TLS_CONNECTIONS" -gt 0
              exit 0
            fi
            sleep 2
          done
          docker logs umami-test
          exit 1
